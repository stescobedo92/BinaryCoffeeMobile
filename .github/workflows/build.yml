name: Build

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    needs: analyze-test
    env:
      APP_PATH: build/macos/Build/Products/Release/Binary Coffee.app
      DMG_PATH: dist/binary-coffee-macos.dmg
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_KEYCHAIN_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Import Developer ID certificate
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application signing identity found in imported certificate."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - name: Sign macOS app with Developer ID
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          codesign --force --deep --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Ad-hoc sign macOS app
        if: ${{ env.HAS_MACOS_SIGNING != 'true' }}
        run: |
          echo "Developer ID signing secrets were not provided. Building an unsigned development DMG."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Package DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R "$APP_PATH" dist/dmg-root/
          hdiutil create -volname "Binary Coffee" -srcfolder dist/dmg-root -ov -format UDZO "$DMG_PATH"
      - name: Sign and notarize DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          spctl -a -vv --type open "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-macos-dmg
          path: dist/binary-coffee-macos.dmg

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\binary-coffee-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-windows-exe
          path: dist/binary-coffee-windows.zip

  linux-deb:
    name: Linux DEB
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Package DEB
        run: |
          APP=binary-coffee
          VERSION=${GITHUB_REF_NAME#v}
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d+ -f1)
          fi
          VERSION=${VERSION:-1.0.0}
          ROOT=dist/deb/${APP}_${VERSION}_amd64
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/lib/$APP" "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/256x256/apps"
          cp -R build/linux/x64/release/bundle/* "$ROOT/usr/lib/$APP/"
          cp assets/images/app_icon.png "$ROOT/usr/share/icons/hicolor/256x256/apps/$APP.png"
          cat > "$ROOT/usr/share/applications/$APP.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Binary Coffee
          Exec=/usr/lib/$APP/binary_coffee_mobile
          Icon=$APP
          Categories=Network;News;
          DESKTOP
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: $APP
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Binary Coffee <website@binary-coffee.dev>
          Description: Binary Coffee blog reader
          CONTROL
          dpkg-deb --build "$ROOT" "dist/${APP}_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-linux-deb
          path: dist/*.deb
