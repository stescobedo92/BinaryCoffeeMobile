name: Build

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R "build/macos/Build/Products/Release/Binary Coffee.app" dist/dmg-root/
          hdiutil create -volname "Binary Coffee" -srcfolder dist/dmg-root -ov -format UDZO dist/binary-coffee-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-macos-dmg
          path: dist/binary-coffee-macos.dmg

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\binary-coffee-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-windows-exe
          path: dist/binary-coffee-windows.zip

  linux-deb:
    name: Linux DEB
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Package DEB
        run: |
          APP=binary-coffee
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION:-1.0.0}
          ROOT=dist/deb/${APP}_${VERSION}_amd64
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/lib/$APP" "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/256x256/apps"
          cp -R build/linux/x64/release/bundle/* "$ROOT/usr/lib/$APP/"
          cp assets/images/app_icon.png "$ROOT/usr/share/icons/hicolor/256x256/apps/$APP.png"
          cat > "$ROOT/usr/share/applications/$APP.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Binary Coffee
          Exec=/usr/lib/$APP/binary_coffee_mobile
          Icon=$APP
          Categories=Network;News;
          DESKTOP
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: $APP
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Binary Coffee <website@binary-coffee.dev>
          Description: Binary Coffee blog reader
          CONTROL
          dpkg-deb --build "$ROOT" "dist/${APP}_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-coffee-linux-deb
          path: dist/*.deb
